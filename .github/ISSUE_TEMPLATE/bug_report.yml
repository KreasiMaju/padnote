name: Bug report
description: Something in PadNote doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Issues are public. Do not include private file contents, passwords or keys.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file with ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PadNote version
      description: Shown at the bottom of the Help menu.
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.1, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details
      description: Drag images or videos here. Crash reports from Console.app are welcome.
